{{define "user/login.html"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{.Title}} · VietPanel</title>
  <link rel="stylesheet" href="/static/dist/output.css" />
  <script defer src="/static/vendor/alpine.min.js"></script>
</head>
<body class="min-h-screen bg-slate-900 flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="mx-auto mb-3 h-12 w-12 rounded-xl bg-blue-600 flex items-center justify-center text-white text-2xl font-bold">V</div>
      <h1 class="text-2xl font-bold text-white">VietPanel</h1>
      <p class="text-slate-400 text-sm mt-1">Sign in to your hosting account</p>
    </div>
    <div class="bg-white rounded-xl shadow-xl p-8">
      {{if .Error}}<div class="mb-4 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3">{{.Error}}</div>{{end}}
      <form method="post" action="/login" class="space-y-4">
        {{.CSRFField}}
        {{if .Next}}<input type="hidden" name="next" value="{{.Next}}" />{{end}}
        <div>
          <label for="username" class="block text-sm font-medium text-slate-700 mb-1">Username</label>
          <input id="username" name="username" autocomplete="username" required class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <button type="submit" class="w-full rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 text-sm">Sign in</button>
      </form>
    </div>
    <p class="text-center text-slate-500 text-xs mt-6">VietPanel v0.1.0</p>
  </div>
</body>
</html>
{{end}}
