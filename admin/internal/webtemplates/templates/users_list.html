{{define "users_list.html"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{.Title}} · VietAdmin</title>
  <link rel="stylesheet" href="/static/dist/output.css" />
  <script defer src="/static/vendor/alpine.min.js"></script>
</head>
<body class="bg-slate-100">
  <div class="flex h-screen overflow-hidden">
    {{template "_sidebar" .}}
    <div class="flex-1 flex flex-col overflow-hidden">
      {{template "_header" .}}
      <main class="flex-1 overflow-y-auto p-6">
        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-xl font-semibold text-slate-800">Users</h2>
            <p class="text-sm text-slate-500 mt-1">Manage hosting accounts.</p>
          </div>
          <button class="rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 text-sm" disabled>Add user</button>
        </div>

        <div class="mt-6 bg-white rounded-xl border border-slate-200 overflow-hidden">
          <table class="w-full text-sm">
            <thead class="bg-slate-50 text-slate-500 text-left">
              <tr>
                <th class="px-6 py-3 font-medium">Username</th>
                <th class="px-6 py-3 font-medium">Email</th>
                <th class="px-6 py-3 font-medium">Plan</th>
                <th class="px-6 py-3 font-medium">Status</th>
                <th class="px-6 py-3 font-medium">Created</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
              <tr>
                <td colspan="5" class="px-6 py-10 text-center text-slate-400">
                  No users yet — user management ships with P6.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
      {{template "_footer" .}}
    </div>
  </div>
</body>
</html>
{{end}}
