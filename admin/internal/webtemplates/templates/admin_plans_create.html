{{define "admin_plans_create.html"}}<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>{{.Title}} · VietAdmin</title><link rel="stylesheet" href="/static/dist/output.css"/><script defer src="/static/vendor/alpine.min.js"></script></head>
<body class="bg-slate-100"><div class="flex h-screen overflow-hidden">{{template "_sidebar" .}}<div class="flex-1 flex flex-col overflow-hidden">{{template "_header" .}}<main class="flex-1 overflow-y-auto p-6"><div class="max-w-xl"><a href="/admin/plans" class="text-sm text-blue-600 hover:text-blue-800">&larr; Back to plans</a><h2 class="text-xl font-semibold text-slate-800 mt-3">Create Plan</h2>
<form method="post" action="/admin/plans/new" class="mt-6 bg-white rounded-xl border border-slate-200 p-6 space-y-4">
{{.CSRFToken}}
<div><label class="block text-sm font-medium text-slate-700 mb-1">Plan Name</label><input name="name" type="text" required class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"/></div>
<div class="grid grid-cols-2 gap-4">
<div><label class="block text-sm font-medium text-slate-700 mb-1">Domains</label><input name="domains" type="number" value="5" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"/></div>
<div><label class="block text-sm font-medium text-slate-700 mb-1">Websites</label><input name="websites" type="number" value="10" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"/></div>
<div><label class="block text-sm font-medium text-slate-700 mb-1">DB Limit</label><input name="db_limit" type="number" value="10" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"/></div>
<div><label class="block text-sm font-medium text-slate-700 mb-1">Disk Limit</label><input name="disk_limit" type="text" value="5 GB" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"/></div>
<div><label class="block text-sm font-medium text-slate-700 mb-1">CPU</label><input name="cpu" type="text" value="2" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"/></div>
<div><label class="block text-sm font-medium text-slate-700 mb-1">RAM</label><input name="ram" type="text" value="2G" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"/></div>
<div><label class="block text-sm font-medium text-slate-700 mb-1">Bandwidth (GB)</label><input name="bandwidth" type="number" value="100" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"/></div>
<div><label class="block text-sm font-medium text-slate-700 mb-1">Feature Set</label><select name="feature_set" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"><option>default</option><option>extended</option><option>premium</option></select></div>
</div><button type="submit" class="w-full py-2.5 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700">Create Plan</button></form></div></main>{{template "_footer" .}}</div></div></body></html>{{end}}
