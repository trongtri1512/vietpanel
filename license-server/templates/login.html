<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · VietPanel License</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0f172a; font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .card { width: 100%; max-width: 380px; background: #fff; border-radius: 14px; padding: 32px;
          box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .brand .logo { width: 34px; height: 34px; border-radius: 8px; background: #2563eb; color: #fff;
                 display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .brand h1 { font-size: 18px; margin: 0; color: #0f172a; }
  label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin: 0 0 6px; }
  input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
  input:focus { outline: 2px solid #93c5fd; border-color: #2563eb; }
  button { width: 100%; margin-top: 16px; padding: 11px; border: 0; border-radius: 8px; background: #0f172a;
           color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  button:hover { background: #1e293b; }
  .err { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; border-radius: 8px;
         padding: 10px 12px; font-size: 13px; margin-bottom: 14px; }
  .hint { margin-top: 14px; font-size: 12px; color: #64748b; text-align: center; }
</style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <div class="brand"><span class="logo">V</span><h1>VietPanel License</h1></div>
    {{if .Error}}<div class="err">{{.Error}}</div>{{end}}
    <label for="token">Admin token</label>
    <input id="token" name="token" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Sign in</button>
    <p class="hint">Token = LICENSE_ADMIN_TOKEN of the license-server.</p>
  </form>
</body>
</html>
